# Giữ tên project để tiếp tục dùng volume MySQL khoa_khoa_mysql hiện tại.
name: khoa

services:
  backend:
    image: khoa-backend:latest
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:mysql://mysql:3306/khoa?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DATABASE_USERNAME: khoa
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-khoa_local_password}
      DEMO_CHECKOUT_ENABLED: "true"
      AI_SERVICE_URL: http://advisor:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-60}
      AI_STREAM_TIMEOUT_SECONDS: ${AI_STREAM_TIMEOUT_SECONDS:-75}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8081}:8080"
    depends_on:
      advisor:
        condition: service_healthy
      mysql:
        condition: service_healthy

  advisor:
    build: ../AI
    image: khoa-advisor:latest
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${AI_MEMORY_LIMIT:-2g}
    environment:
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-development}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_REQUIRE_KNOWLEDGE: ${AI_REQUIRE_KNOWLEDGE:-true}
      AI_READINESS_REQUIRE_LLM: ${AI_READINESS_REQUIRE_LLM:-false}
      AI_MAX_ACTIVE_REQUESTS: ${AI_MAX_ACTIVE_REQUESTS:-8}
      AI_CATALOG_PATH: /app/imported/catalog.json
      AI_KNOWLEDGE_PATH: /app/imported/secops.json
      AI_MODEL_PATH: ${AI_MODEL_PATH:-}
      AI_LLM_ENABLED: ${AI_LLM_ENABLED:-true}
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-http://host.docker.internal:11434}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-qwen3:0.6b}
      AI_LLM_THINKING: ${AI_LLM_THINKING:-false}
      AI_LLM_CONTEXT_TOKENS: ${AI_LLM_CONTEXT_TOKENS:-2048}
      AI_LLM_MAX_OUTPUT_TOKENS: ${AI_LLM_MAX_OUTPUT_TOKENS:-256}
      AI_LLM_TIMEOUT_SECONDS: ${AI_LLM_TIMEOUT_SECONDS:-45}
      AI_LLM_KEEP_ALIVE: ${AI_LLM_KEEP_ALIVE:-1m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../AI/data:/app/imported:ro
      - ../AI/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: khoa
      MYSQL_USER: khoa
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-khoa_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - khoa_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  khoa_mysql:
