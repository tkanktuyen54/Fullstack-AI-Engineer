spring:
  application:
    name: khoa-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/khoa?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME:khoa}
    password: ${DATABASE_PASSWORD:khoa_local_password}
    hikari:
      pool-name: khoa-mysql
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  sql:
    init:
      mode: never
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

app:
  demo-checkout-enabled: ${DEMO_CHECKOUT_ENABLED:false}
  mcp:
    allowed-hosts: ${EMPLOYEE_MCP_ALLOWED_HOSTS:localhost:*,127.0.0.1:*,backend:8080}
    allowed-origins: ${EMPLOYEE_MCP_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  ai:
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    token: ${AI_SERVICE_TOKEN:}
    local-model: ${AI_LLM_MODEL:qwen3:0.6b}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:60}
    stream-timeout-seconds: ${AI_STREAM_TIMEOUT_SECONDS:75}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    csrf:
      enabled: true
